<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S2 | Web Console</title>
  <script src="/static/htmx.min.js"></script>
  <script>
    // A restore past htmx's cache is a bare XHR that hx-sync does not reach, kept here so what replaces it can abort it.
    let restoreXhr = null;
    // Back and Forward swap the main view from under a navigation in flight, whose response would still push its URL; in head, which a history restore does not re-run, and before htmx's own popstate handler of DOMContentLoaded.
    window.addEventListener('popstate', function() { htmx.trigger('#main-content', 'htmx:abort'); if (restoreXhr) restoreXhr.abort(); });
    // A restore past the cache and a main-view request that pushes a URL each abort the other when about to land, whichever is first.
    document.addEventListener('htmx:beforeHistoryUpdate', function() { if (restoreXhr) restoreXhr.abort(); });
    document.addEventListener('htmx:historyCacheMissLoad', function() { htmx.trigger('#main-content', 'htmx:abort'); });
    // htmx swaps nothing when such a restore fails, which would leave the earlier page under the restored URL, unless the user has moved on meanwhile.
    function reloadIfStillOn(path) { if (path === location.pathname + location.search) location.reload(); }
    document.addEventListener('htmx:historyCacheMiss', function(e) {
      restoreXhr = e.detail.xhr;
      // A network failure fires no htmx event.
      restoreXhr.addEventListener('error', function() { reloadIfStillOn(e.detail.path); });
    });
    document.addEventListener('htmx:historyCacheMissLoadError', function(e) { reloadIfStillOn(e.detail.path); });
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="logo-area">
          <div class="logo-icon">
            <svg viewBox="0 0 48 48" width="44" height="44">
              <rect x="1" y="1" width="46" height="46" rx="11" ry="11" fill="#1e7cf5"/>
              <rect x="7" y="7" width="34" height="34" rx="6" ry="6" fill="none" stroke="white" stroke-width="2.5"/>
              <text x="24" y="33" text-anchor="middle" font-weight="800" font-size="20" fill="white">S2</text>
            </svg>
          </div>
          <span>Simple Storage</span>
        </a>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="section-header">
          <h3>Buckets</h3>
          <button class="btn btn--icon-xs btn--surface" onclick="this.closest('.sidebar-section').querySelector('.new-bucket-form').classList.toggle('active')">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <form class="new-bucket-form" hx-post="/buckets" hx-target=".bucket-list" hx-swap="outerHTML"
          hx-on::after-request="afterBucketCreate(this, event)">
          <input type="text" name="name" placeholder="New bucket name..." required>
          <button type="submit">Create</button>
        </form>

        {{template "console/buckets/list.html" .}}
      </div>
    </aside>

    <main class="content">
      <button class="mobile-sidebar-toggle" onclick="toggleSidebar()" title="Open menu" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div id="main-content">
        {{if .BucketName}}{{template "console/buckets/objects.html" .}}{{else}}{{template "console/empty.html" .}}{{end}}
      </div>

      <div id="loading" class="htmx-indicator">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>

  <dialog id="preview-dialog" onclick="if(event.target===this)this.close()">
  </dialog>

  <script>
    (function() {
      const layout = document.querySelector('.layout');
      const narrowQuery = window.matchMedia('(max-width: 900px)');
      const stored = localStorage.getItem('s2-sidebar-collapsed');
      const collapsed = stored === null ? narrowQuery.matches : stored === 'true';
      if (collapsed) {
        layout.classList.add('layout--sidebar-collapsed');
      }
      // Mark the entry of the bucket the URL shows. htmx snapshots the page and pushes the URL before it swaps, so marking after the swap keeps Back right, and a failed open swaps nothing.
      // scroll is 'always', 'new' (only to an entry not marked before) or 'none'.
      const markOpenBucket = function(scroll) {
        let name = null;
        try {
          name = decodeURIComponent(location.pathname.match(/^\/buckets\/([^/]+)/)?.[1] ?? '');
        } catch (e) {}
        document.querySelectorAll('.bucket-item').forEach(function(el) {
          const open = el.title === name;
          if (open && (scroll === 'always' || (scroll === 'new' && !el.classList.contains('active')))) el.scrollIntoView({block: 'nearest'});
          el.classList.toggle('active', open);
        });
      };
      // A page load or a history restore builds the sidebar anew, scrolled to the top.
      markOpenBucket('always');
      document.addEventListener('htmx:historyRestore', function() { markOpenBucket('always'); });
      // e.target, not detail.target: a delete's out-of-band reset of the main view reports the replaced list as detail.target.
      document.addEventListener('htmx:afterSwap', function(e) {
        // Moving within a bucket leaves the sidebar where the user put it.
        if (e.target.id === 'main-content') markOpenBucket('new');
        // A create or delete answers the list unmarked; mark it again without moving it.
        else if (e.target.matches?.('.bucket-list')) markOpenBucket('none');
      });
      window.toggleSidebar = function() {
        const isCollapsed = layout.classList.toggle('layout--sidebar-collapsed');
        localStorage.setItem('s2-sidebar-collapsed', isCollapsed);
        // A collapsed desktop sidebar hides the list, so its marked entry could not be scrolled to until now.
        if (!isCollapsed) document.querySelector('.bucket-item.active')?.scrollIntoView({block: 'nearest'});
      };
      window.closeSidebarOnNarrow = function() {
        if (!narrowQuery.matches) return;
        if (layout.classList.contains('layout--sidebar-collapsed')) return;
        layout.classList.add('layout--sidebar-collapsed');
        localStorage.setItem('s2-sidebar-collapsed', 'true');
      };
      window.afterBucketCreate = function(form, event) {
        if (!event.detail.successful) return;
        const name = form.elements.name.value;
        form.reset();
        form.classList.remove('active');
        // Open it as a click on its new entry does, which also pushes its URL (htmx.ajax takes no pushUrl); htmx wires the entry once the new list settles.
        document.querySelector('.bucket-list').addEventListener('htmx:afterSettle', function() {
          Array.from(document.querySelectorAll('.bucket-item')).find(a => a.title === name)?.click();
        }, {once: true});
      };
      // On narrow, close the drawer when a bucket or the logo is clicked
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.bucket-item, .logo-area')) return;
        closeSidebarOnNarrow();
      });
    })();
  </script>

  {{template "scripts:console/buckets/objects.html" .}}
</body>

</html>
