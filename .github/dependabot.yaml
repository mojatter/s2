version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /azblob
      - /cmd/s2-server
      - /gcs
      - /s2env
      - /s3
      - /server
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/chromedp/*"
      # chromedp breaks its API often; keep it out of the group so it cannot block the other bumps.
      chromedp:
        patterns:
          - "github.com/chromedp/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
