name: govulncheck

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday 03:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - '*/go.mod'
      - '*/go.sum'
      - '.github/workflows/govulncheck.yaml'

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Detect highest Go version across modules
        id: go-version
        run: |
          v=$(find . -name go.mod -exec awk '/^go [0-9]/ {print $2}' {} + \
                | sort -V | tail -1 | cut -d. -f1-2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          check-latest: true
      -
        name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      -
        name: Run govulncheck (root)
        run: govulncheck ./...
      -
        name: Run govulncheck (submodules)
        run: |
          for dir in s3 gcs azblob s2env s2test server; do
            echo "=== govulncheck $dir ==="
            (cd $dir && govulncheck ./...)
          done
