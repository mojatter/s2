name: Tests

on:
  push:
    branches:
      - main
      - develop
      - 'develop/**'
  pull_request:
    branches:
      - main
      - develop
      - 'develop/**'
      - 'release/**'
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        # go-version-file would install go.work's exact x.y.0; take its minor and the latest patch.
        name: Pick Go minor from go.work
        id: go
        run: echo "minor=$(awk '/^go [0-9]/ {print $2}' go.work | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.minor }}
          check-latest: true
      -
        name: Run go test
        run: |
          go mod tidy
          go test -race -v ./...
      -
        name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
      -
        name: Test submodules
        run: |
          for dir in s3 gcs azblob s2env server cmd/s2-server; do
            echo "=== Testing $dir ==="
            (cd $dir && go test -race -v ./...)
          done
      -
        name: Lint submodules
        run: |
          for dir in s3 gcs azblob s2env server cmd/s2-server; do
            echo "=== Linting $dir ==="
            (cd $dir && golangci-lint run ./...)
          done
